name: Independent Wiki verification
on:
  push:
    branches: [main]
    paths: ['personal-wiki/**', 'deploy/Caddyfile.lan', 'docker-compose.lan.yml', '.github/workflows/wiki-site.yml']
  pull_request:
    paths: ['personal-wiki/**', 'deploy/Caddyfile.lan', 'docker-compose.lan.yml', '.github/workflows/wiki-site.yml']
permissions:
  contents: read
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
jobs:
  wiki-site:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Compile independent Wiki entrypoints
        run: python -m py_compile personal-wiki/api/server.py personal-wiki/api/workspace_server.py personal-wiki/api/site_server.py
      - name: Test real knowledge service and HTML access boundaries
        run: python -m unittest discover -s personal-wiki/tests
      - name: Check browser script syntax
        run: node --check personal-wiki/api/static/wiki.js
      - name: Install browser verification tools
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Verify independent Wiki against a real isolated service
        env:
          WIKI_UI_OUTPUT_DIR: artifacts/wiki
        run: python personal-wiki/tests/ui/smoke.py
      - name: Build independent Wiki image
        run: docker build -f personal-wiki/api/Dockerfile -t personal-wiki:ui-test personal-wiki
      - name: Upload independent Wiki reports and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wiki-site-verification
          path: artifacts/wiki
          retention-days: 7
          if-no-files-found: ignore
