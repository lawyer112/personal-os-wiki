name: Import reviewed workspace once
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
jobs:
  import:
    if: github.repository == 'lawyer112/personal-os-wiki' && github.event.pull_request.number == 63 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'codex/chinese-lan-workspace-20260922'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
    concurrency:
      group: reviewed-workspace-import-63
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/chinese-lan-workspace-20260922
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply exact locally verified source changes
        id: apply
        shell: bash
        run: |
          if [ ! -f .github/review-import/part-0.bin ]; then
            echo 'active=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python3 - <<'PY'
          import hashlib, json, lzma
          from pathlib import Path
          root = Path.cwd()
          raw = b''.join((root / '.github/review-import' / f'part-{i}.bin').read_bytes() for i in range(3))
          assert hashlib.sha256(raw).hexdigest() == '1271a1b715cf84c7d2bf80161b0f93c5844c76a52bef2692bcef3c807a6e5e18', 'Bundle integrity mismatch'
          bundle = json.loads(lzma.decompress(raw))
          assert bundle['version'] == 1
          prepared = []
          seen = set()
          for item in bundle['files']:
              relative = Path(item['path'])
              assert not relative.is_absolute() and '..' not in relative.parts and '.git' not in relative.parts
              assert item['path'] not in seen
              seen.add(item['path'])
              path = root / relative
              assert path.resolve().is_relative_to(root)
              original = path.read_bytes() if path.exists() else b''
              if item['path'].startswith('.github/workflows/'):
                  assert hashlib.sha256(original).hexdigest() == item['result'], 'Workflow must already be updated through repository API'
                  continue
              if item['base'] is None:
                  assert not path.exists(), f'New file already exists: {relative}'
              else:
                  assert hashlib.sha256(original).hexdigest() == item['base'], f'Concurrent modification: {relative}'
              lines = original.decode('utf-8').splitlines(keepends=True)
              for change in reversed(item['changes']):
                  assert 0 <= change['start'] <= change['end'] <= len(lines)
                  lines[change['start']:change['end']] = change['text'].splitlines(keepends=True)
              result = ''.join(lines).encode('utf-8')
              assert hashlib.sha256(result).hexdigest() == item['result'], f'Reconstructed content mismatch: {relative}'
              prepared.append((path, result))
          for path, content in prepared:
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(content)
          for i in range(3):
              (root / '.github/review-import' / f'part-{i}.bin').unlink()
          print(f'Applied {len(prepared)} verified files; workflow content was independently installed.')
          PY
          echo 'active=true' >> "$GITHUB_OUTPUT"
      - name: Refresh compatible dependency patches
        if: steps.apply.outputs.active == 'true'
        working-directory: personal-os-app
        run: |
          npm install --package-lock-only --ignore-scripts 'next@~16.2.7' 'eslint-config-next@~16.2.7' 'react@~19.2.4' 'react-dom@~19.2.4'
      - name: Commit only to the review branch
        if: steps.apply.outputs.active == 'true'
        run: |
          test "$(git branch --show-current)" = 'codex/chinese-lan-workspace-20260922'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          if git diff --cached --name-only | grep -q '^.github/workflows/'; then
            echo 'Workflow modifications must use the repository API, not the importer.'
            exit 1
          fi
          git commit -m 'feat(workspace): 完成中文知识手册、独立智能体协议与局域网部署说明'
          git push origin HEAD:refs/heads/codex/chinese-lan-workspace-20260922
