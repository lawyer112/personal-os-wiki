name: Apply verified atlas UI
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
jobs:
  apply:
    if: github.repository == 'lawyer112/personal-os-wiki' && github.event.pull_request.number == 63 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'codex/chinese-lan-workspace-20260922'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    concurrency:
      group: atlas-ui-import-63
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/chinese-lan-workspace-20260922
      - name: Apply integrity-checked visual changes
        id: apply
        shell: bash
        run: |
          if [ ! -f .github/atlas-review/part-0.txt ]; then
            echo 'active=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python3 - <<'PY'
          import base64, hashlib, lzma, os, subprocess
          from pathlib import Path
          encoded = ''.join(Path(f'.github/atlas-review/part-{i}.txt').read_text() for i in range(3))
          raw = base64.b64decode(encoded, validate=True)
          assert hashlib.sha256(raw).hexdigest() == '070dc1233279aef534aa101b05f804074e6fe07c6047d8797f9631eb29cda2e9'
          patch = lzma.decompress(raw)
          allowed = {
            'personal-os-app/src/app/auth/read/route.ts',
            'personal-os-app/src/app/layout.tsx',
            'personal-os-app/src/components/AppShell.tsx',
            'personal-os-app/src/components/workspace/AppearanceControls.tsx',
            'personal-os-app/src/components/workspace/AtlasHero.tsx',
            'personal-os-app/src/components/workspace/Icons.tsx',
            'personal-os-app/src/components/workspace/KnowledgeOrbit.tsx',
            'personal-os-app/src/components/workspace/OverviewWorkspace.tsx',
            'personal-os-app/src/components/workspace/TaskWorkspace.tsx',
            'personal-os-app/src/components/workspace/editorial.css',
            'personal-os-app/tests/ui/smoke.py',
          }
          names = {line.split(' b/', 1)[1] for line in patch.decode().splitlines() if line.startswith('diff --git ')}
          assert names == allowed, 'Unexpected changed paths'
          target = Path(os.environ['RUNNER_TEMP']) / 'atlas-ui.patch'
          target.write_bytes(patch)
          subprocess.run(['git', 'apply', '--check', str(target)], check=True)
          subprocess.run(['git', 'apply', str(target)], check=True)
          subprocess.run(['git', 'add', '--', *sorted(allowed)], check=True)
          for i in range(3):
            part = f'.github/atlas-review/part-{i}.txt'
            subprocess.run(['git', 'rm', '--', part], check=True)
          staged = set(subprocess.check_output(['git', 'diff', '--cached', '--name-only'], text=True).splitlines())
          assert staged == allowed | {f'.github/atlas-review/part-{i}.txt' for i in range(3)}
          print('Applied 11 verified UI and browser-test source files.')
          PY
          echo 'active=true' >> "$GITHUB_OUTPUT"
      - name: Commit only the reviewed UI changes
        if: steps.apply.outputs.active == 'true'
        run: |
          test "$(git branch --show-current)" = 'codex/chinese-lan-workspace-20260922'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git diff --cached --quiet && exit 0
          git commit -m 'feat(ui): 墨色星图视觉系统、原创动态图形与交互反馈'
          git push origin HEAD:refs/heads/codex/chinese-lan-workspace-20260922
