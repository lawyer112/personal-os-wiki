name: Import verified standalone Wiki once
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
jobs:
  import:
    if: github.repository == 'lawyer112/personal-os-wiki' && github.event.pull_request.number == 63 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'codex/chinese-lan-workspace-20260922'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    concurrency:
      group: wiki-site-import-63
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/chinese-lan-workspace-20260922
      - name: Apply integrity-checked source changes
        id: apply
        run: |
          if [ ! -f .github/wiki-ui-import/part-0.bin ]; then
            echo 'active=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python3 - <<'PY'
          import hashlib, json, lzma
          from pathlib import Path
          root = Path.cwd()
          raw = b''.join((root / '.github/wiki-ui-import' / f'part-{i}.bin').read_bytes() for i in range(7))
          assert hashlib.sha256(raw).hexdigest() == '1be719c65940ae9cc1e494b0c1f4892d949e22c7af8afd267b40a9cf71e52f57', 'Bundle checksum mismatch'
          bundle = json.loads(lzma.decompress(raw))
          assert bundle['version'] == 1
          allowed = {'personal-wiki/api/site_server.py', 'personal-wiki/api/static/wiki.css', 'personal-wiki/api/static/wiki.js', 'personal-wiki/api/server.py', 'personal-wiki/api/workspace_server.py', 'personal-wiki/api/Dockerfile', 'personal-wiki/scripts/start.sh', 'personal-wiki/docs/USAGE.md', 'personal-wiki/tests/test_site.py', 'personal-wiki/tests/ui/demo_data.py', 'personal-wiki/tests/ui/smoke.py', 'docs/WIKI_STANDALONE_UI_ZH.md', 'deploy/Caddyfile.lan', 'docker-compose.lan.yml'}
          prepared, seen = [], set()
          for item in bundle['files']:
              assert item['path'] in allowed and item['path'] not in seen
              seen.add(item['path'])
              relative = Path(item['path'])
              assert not relative.is_absolute() and '..' not in relative.parts
              path = root / relative
              assert path.resolve().is_relative_to(root)
              original = path.read_bytes() if path.exists() else b''
              if item['base'] is None:
                  assert not path.exists(), f'New file already exists: {relative}'
              else:
                  assert hashlib.sha256(original).hexdigest() == item['base'], f'Concurrent change: {relative}'
              lines = original.decode('utf-8').splitlines(keepends=True)
              for change in reversed(item['changes']):
                  assert 0 <= change['start'] <= change['end'] <= len(lines)
                  lines[change['start']:change['end']] = change['text'].splitlines(keepends=True)
              content = ''.join(lines).encode('utf-8')
              assert hashlib.sha256(content).hexdigest() == item['result'], f'Result checksum mismatch: {relative}'
              prepared.append((path, content))
          assert seen == allowed
          for path, content in prepared:
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(content)
          for i in range(7):
              (root / '.github/wiki-ui-import' / f'part-{i}.bin').unlink()
          print(f'Applied {len(prepared)} integrity-checked source files.')
          PY
          echo 'active=true' >> "$GITHUB_OUTPUT"
      - name: Commit only to the review branch
        if: steps.apply.outputs.active == 'true'
        run: |
          test "$(git branch --show-current)" = 'codex/chinese-lan-workspace-20260922'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          if git diff --cached --name-only | grep -q '^.github/workflows/'; then
            echo 'Workflow changes must use the repository API.'
            exit 1
          fi
          git commit -m 'feat(wiki): 独立知识库全站中文视觉、真实图谱与版本编辑'
          git push origin HEAD:refs/heads/codex/chinese-lan-workspace-20260922
